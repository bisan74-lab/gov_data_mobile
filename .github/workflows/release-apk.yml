name: Release APK

# 수동 트리거 전용 — 테스트 설치용 APK를 GitHub Release로 배포한다.
# (Actions 아티팩트는 조직 네트워크 정책에 따라 다운로드가 막히는 경우가 있어
#  누구나 로그인 없이 받을 수 있는 Release 첨부 파일 방식을 쓴다.)
on:
  workflow_dispatch:
    inputs:
      ads:
        description: '광고 (test=구글 테스트 광고 / real=실제 AdMob 광고)'
        type: choice
        default: test
        options: [test, real]
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: stable
          cache: true

      # Android 16(API 36)을 타겟팅하므로 해당 플랫폼이 러너에 있어야 한다.
      # 러너 이미지에 이미 있으면 sdkmanager가 즉시 끝나고, 없으면 내려받는다
      # (없는 상태로 빌드하면 "failed to find target with hash string
      # android-36"으로 실패한다).
      - name: Android SDK 36 확인
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: 의존성 설치
        run: flutter pub get

      # 광고 ID를 실제 것으로 쓸지 결정한다.
      #
      # **기본은 테스트 광고다.** 자기 기기에 깔아 보는 확인용 빌드에 실제
      # 광고를 넣으면 내 노출·클릭이 무효 트래픽으로 잡혀 AdMob 계정이
      # 정지될 수 있다. 스토어 제출 직전 확인이 필요할 때만 실행 시
      # `ads=real`을 고른다.
      #
      # `real`인데 Secret이 비어 있으면 **빌드를 멈춘다** — 실제 광고를
      # 기대하고 돌렸는데 조용히 테스트 광고가 박힌 APK가 나오면 그걸
      # 그대로 스토어에 올리게 된다.
      - name: 광고 설정 결정
        id: ads
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
        run: |
          if [ "${{ inputs.ads }}" = "real" ]; then
            if [ -z "$ADMOB_APP_ID" ] || [ -z "$ADMOB_BANNER_AD_UNIT_ID" ]; then
              echo "::error::ads=real인데 ADMOB_APP_ID 또는 " \
                "ADMOB_BANNER_AD_UNIT_ID Secret이 비어 있습니다."
              exit 1
            fi
            echo "real=true" >> "$GITHUB_OUTPUT"
            echo "label=실제 AdMob 광고" >> "$GITHUB_OUTPUT"
          else
            echo "real=false" >> "$GITHUB_OUTPUT"
            echo "label=구글 테스트 광고" >> "$GITHUB_OUTPUT"
          fi

      # 실 API 키·광고 ID는 저장소 Secret에서만 주입한다 — 코드·로그에
      # 노출되지 않는다(GitHub이 로그에서 Secret 값을 가린다).
      # `DATA_GO_KR_API_KEY` Secret이 없으면 빈 값이 들어가 자동으로
      # 합성(mock) 데이터로 동작한다.
      #
      # 광고 단위 ID는 `--dart-define`(Dart 코드가 읽는다), AdMob **앱 ID**는
      # `ADMOB_APP_ID` 환경변수(Gradle이 AndroidManifest에 채운다)로 들어가는
      # **경로가 다르다**. 둘 중 하나만 실제 값이면 광고가 조용히 안 나온다.
      # `ads=test`일 때는 둘 다 넘기지 않아 Env·Gradle의 기본값(구글 공식
      # 테스트 ID)이 그대로 쓰인다.
      - name: 릴리스 APK 빌드
        run: |
          ad_defines=()
          if [ "${{ steps.ads.outputs.real }}" = "true" ]; then
            # Gradle이 AndroidManifest에 채울 앱 ID(경로가 다르다).
            export ADMOB_APP_ID='${{ secrets.ADMOB_APP_ID }}'
            ad_defines=(
              "--dart-define=ADMOB_BANNER_AD_UNIT_ID=${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}"
              "--dart-define=ADMOB_WEATHER_BANNER_AD_UNIT_ID=${{ secrets.ADMOB_WEATHER_BANNER_AD_UNIT_ID }}"
              "--dart-define=ADMOB_SETTINGS_BANNER_AD_UNIT_ID=${{ secrets.ADMOB_SETTINGS_BANNER_AD_UNIT_ID }}"
            )
          fi
          flutter build apk --release \
            --dart-define=DATA_GO_KR_API_KEY=${{ secrets.DATA_GO_KR_API_KEY }} \
            "${ad_defines[@]}"

      # 태그와 **버전명**을 함께 계산한다. pubspec의 `version: 0.1.0+1`은
      # `버전명+빌드번호(versionCode)` 형식이라 `+`를 기준으로 나눈다.
      # 내려받은 APK 파일만 보고도 어느 버전인지 알 수 있도록 파일명에
      # 버전명을 넣는다(파일명엔 `+`를 쓰지 않는다 — 일부 환경에서 URL의
      # `+`가 공백으로 해석돼 다운로드가 깨질 수 있다).
      - name: 태그·버전 계산
        id: vars
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml \
            | sed 's/^version:[[:space:]]*//' | tr -d '\r')
          version_name="${version%%+*}"
          version_code="${version##*+}"
          tag="test-build-${GITHUB_RUN_NUMBER}"
          {
            echo "tag=${tag}"
            echo "version_name=${version_name}"
            echo "version_code=${version_code}"
            echo "apk_name=golfwindy-v${version_name}-${tag}.apk"
          } >> "$GITHUB_OUTPUT"
          echo "버전 ${version_name}(빌드 ${version_code}) / 태그 ${tag}"

      - name: APK 파일명에 버전 반영
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/${{ steps.vars.outputs.apk_name }}"

      - name: GitHub Release 생성 및 APK 첨부
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: >-
            골프윈디 v${{ steps.vars.outputs.version_name }}
            (${{ steps.vars.outputs.tag }})
          body: |
            골프윈디 수동 트리거 테스트 빌드입니다.

            - **버전**: `${{ steps.vars.outputs.version_name }}`
              (빌드 번호 `${{ steps.vars.outputs.version_code }}`)
            - **파일**: `${{ steps.vars.outputs.apk_name }}`
            - **커밋**: `${{ github.sha }}`
            - **광고**: ${{ steps.ads.outputs.label }}

            기상청 단기예보 실데이터는 저장소 Secret이 있을 때만 들어갑니다
            (없으면 합성 데이터로 동작).

            ${{ steps.ads.outputs.real == 'true'
              && '⚠️ **실제 광고가 들어 있습니다.** 본인 기기에서 광고를 누르지 마세요 — 무효 트래픽으로 AdMob 계정이 정지될 수 있습니다.'
              || '광고는 구글 공식 테스트 광고라 마음껏 눌러 봐도 됩니다.' }}
          files: build/app/outputs/flutter-apk/${{ steps.vars.outputs.apk_name }}
          prerelease: true
