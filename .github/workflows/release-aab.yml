name: Play Store AAB

# Play Console에 올릴 **서명된 App Bundle(.aab)**을 만든다.
# 테스트 설치용 APK를 만드는 release-apk.yml과 목적이 다르다:
#  - release-apk.yml : debug 키 서명 + (기본) 테스트 광고. 기기에 설치해 확인용.
#  - 이 워크플로     : 업로드 키 서명 + 실제 광고 ID. 스토어 제출용.
#
# 필요한 저장소 Secret (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64          업로드 키스토어(.jks)를 base64로 인코딩한 값
#                            (로컬에서: base64 -w0 golfwindy-upload.jks)
#   KEYSTORE_PASSWORD        키스토어 비밀번호
#   KEY_ALIAS                키 별칭(예: golfwindy)
#   KEY_PASSWORD             키 비밀번호
#   ADMOB_APP_ID             AdMob 앱 ID (ca-app-pub-XXXX~YYYY)
#   ADMOB_BANNER_AD_UNIT_ID  홈 화면 하단 배너 광고 단위 ID (ca-app-pub-XXXX/YYYY)
#   DATA_GO_KR_API_KEY       공공데이터포털 인증키
# 선택 Secret (없으면 홈 배너 단위를 함께 쓴다):
#   ADMOB_WEATHER_BANNER_AD_UNIT_ID
#   ADMOB_SETTINGS_BANNER_AD_UNIT_ID
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: stable
          cache: true

      # 스토어 제출용 빌드는 서명·광고 설정이 하나라도 빠지면 의미가 없다.
      # 조용히 debug 키/테스트 광고로 빌드되는 대신 여기서 바로 실패시킨다.
      # 있는지뿐 아니라 **형태**도 본다 — 앱 ID(`~`)와 광고 단위 ID(`/`)는
      # 앞부분이 같아 바꿔 넣기 쉬운데, 그러면 빌드는 성공하고 광고만 안 나와
      # 원인을 찾기 어렵다. 값 자체는 출력하지 않는다.
      - name: 필수 Secret 확인
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
          ADMOB_WEATHER_BANNER_AD_UNIT_ID:
            ${{ secrets.ADMOB_WEATHER_BANNER_AD_UNIT_ID }}
          ADMOB_SETTINGS_BANNER_AD_UNIT_ID:
            ${{ secrets.ADMOB_SETTINGS_BANNER_AD_UNIT_ID }}
        run: |
          missing=""
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD \
                      ADMOB_APP_ID ADMOB_BANNER_AD_UNIT_ID; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
              echo "  $name: ❌ 없음"
            else
              echo "  $name: ✅ 있음"
            fi
          done
          for name in ADMOB_WEATHER_BANNER_AD_UNIT_ID \
                      ADMOB_SETTINGS_BANNER_AD_UNIT_ID; do
            if [ -n "${!name}" ]; then
              echo "  $name: ✅ 있음(화면별 단위)"
            else
              echo "  $name: — 없음(선택. 홈 단위를 함께 씀)"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::스토어 제출용 빌드에 필요한 Secret이 없습니다:$missing"
            echo "워크플로 파일 상단 주석의 Secret 목록을 참고해 등록한 뒤 다시 실행하세요."
            exit 1
          fi

          # 광고 ID 형태 검사: 앱 ID는 물결(~), 광고 단위 ID는 슬래시(/).
          bad=""
          case "$ADMOB_APP_ID" in
            ca-app-pub-*~*) ;;
            *) bad="$bad ADMOB_APP_ID(물결 ~ 가 있는 앱 ID여야 함)" ;;
          esac
          for name in ADMOB_BANNER_AD_UNIT_ID ADMOB_WEATHER_BANNER_AD_UNIT_ID \
                      ADMOB_SETTINGS_BANNER_AD_UNIT_ID; do
            v="${!name}"
            [ -z "$v" ] && continue
            case "$v" in
              ca-app-pub-*/*) ;;
              *) bad="$bad $name(슬래시 / 가 있는 광고 단위 ID여야 함)" ;;
            esac
          done
          if [ -n "$bad" ]; then
            echo "::error::광고 ID 형태가 잘못되었습니다:$bad"
            echo "AdMob에서 앱 ID(ca-app-pub-…~…)와 광고 단위 ID(ca-app-pub-…/…)를"
            echo "서로 바꿔 넣지 않았는지 확인하세요."
            exit 1
          fi
          echo "광고 ID 형태 정상(앱 ID는 ~, 광고 단위는 /)"

      - name: 업로드 키스토어 복원
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          # key.properties는 gitignore돼 있고 러너에서만 만들어진다
          # (build.gradle.kts가 이 파일이 있을 때만 실제 키로 서명한다).
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # Android 16(API 36)을 타겟팅하므로 해당 플랫폼이 러너에 있어야 한다.
      # 없는 상태로 빌드하면 "failed to find target with hash string
      # android-36"으로 실패한다.
      - name: Android SDK 36 확인
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: 의존성 설치
        run: flutter pub get

      - name: App Bundle 빌드 (서명 + 실제 광고 ID)
        env:
          # AdMob 앱 ID는 AndroidManifest에 박히므로 Gradle이 환경변수로 읽는다
          # (광고 단위 ID와 **주입 경로가 다르다**).
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
          ADMOB_WEATHER_BANNER_AD_UNIT_ID:
            ${{ secrets.ADMOB_WEATHER_BANNER_AD_UNIT_ID }}
          ADMOB_SETTINGS_BANNER_AD_UNIT_ID:
            ${{ secrets.ADMOB_SETTINGS_BANNER_AD_UNIT_ID }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: |
          # 날씨·설정 단위는 선택이다 — 비어 있으면 Env가 홈 단위로 폴백한다.
          flutter build appbundle --release \
            --dart-define=DATA_GO_KR_API_KEY="$DATA_GO_KR_API_KEY" \
            --dart-define=ADMOB_BANNER_AD_UNIT_ID="$ADMOB_BANNER_AD_UNIT_ID" \
            --dart-define=ADMOB_WEATHER_BANNER_AD_UNIT_ID="$ADMOB_WEATHER_BANNER_AD_UNIT_ID" \
            --dart-define=ADMOB_SETTINGS_BANNER_AD_UNIT_ID="$ADMOB_SETTINGS_BANNER_AD_UNIT_ID"

      - name: 서명·버전 확인
        id: verify
        run: |
          # 서명 없이(또는 debug 키로) 만들어진 결과물이 스토어로 가는 사고를 막는다.
          BUNDLE=build/app/outputs/bundle/release/app-release.aab
          if ! unzip -l "$BUNDLE" | grep -qE "META-INF/.*\.(RSA|DSA|EC)"; then
            echo "::error::App Bundle에 서명이 없습니다."
            exit 1
          fi
          version=$(grep -m1 '^version:' pubspec.yaml \
            | sed 's/^version:[[:space:]]*//' | tr -d '\r')
          {
            echo "version_name=${version%%+*}"
            echo "version_code=${version##*+}"
            echo "sha256=$(sha256sum "$BUNDLE" | cut -d' ' -f1)"
            echo "tag=store-build-${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"
          echo "서명된 App Bundle 확인됨: $BUNDLE"

      - name: 정리 (키스토어·서명 정보 삭제)
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      # 아티팩트 다운로드가 네트워크 정책에 막히는 환경이 있어, Release에도
      # 첨부해 어느 쪽으로든 받을 수 있게 한다(release-apk.yml과 같은 이유).
      - name: GitHub Release 생성 및 AAB 첨부
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.verify.outputs.tag }}
          name: >-
            골프윈디 스토어 제출용 v${{ steps.verify.outputs.version_name }}
            (${{ steps.verify.outputs.tag }})
          body: |
            Play Console에 업로드할 **서명된 App Bundle**입니다.
            (기기 설치용 APK는 `release-apk.yml`이 만드는 test-build-* 릴리스를 쓰세요.)

            - **버전**: `${{ steps.verify.outputs.version_name }}`
              (버전 코드 `${{ steps.verify.outputs.version_code }}`)
            - **커밋**: `${{ github.sha }}`
            - **SHA256**: `${{ steps.verify.outputs.sha256 }}`

            실제 광고 ID가 들어 있습니다.

            업로드 절차:
            1. Play Console → 앱 선택 → 내부 테스트(또는 프로덕션) → 새 버전 만들기
            2. `app-release.aab` 업로드
            3. 출시 노트 작성 후 검토·출시

            **같은 버전 코드는 두 번 올릴 수 없습니다** — 다음 제출 전에
            `pubspec.yaml`의 `version: 0.1.0+N`에서 `+N`을 올리세요.
          files: build/app/outputs/bundle/release/app-release.aab
          prerelease: true
